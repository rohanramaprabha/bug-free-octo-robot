{% extends "base.html" %}

{% block title %}Error — PrivacyVault AI{% endblock %}

{% block content %}
<div class="row justify-content-center py-5 text-center">
    <div class="col-md-6">
        <div class="pv-card p-5">
            <i class="bi bi-exclamation-triangle-fill display-2 text-warning mb-3 d-block"></i>
            <h3 class="fw-bold mb-2">Notice / Operation Error</h3>
            <p class="text-muted mb-4">{{ error or "The requested resource or document could not be located." }}</p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary-custom">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
                <a href="{{ url_for('main.upload') }}" class="btn-primary-custom text-decoration-none">
                    <i class="bi bi-cloud-arrow-up"></i> Upload New File
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
